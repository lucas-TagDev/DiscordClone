<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PartiuChat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .splash {
      width: 360px;
      height: 260px;
      background: #1E1F22;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid #2B2D31;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: #5865F2;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .logo svg {
      width: 48px;
      height: 48px;
      fill: white;
    }
    .title {
      color: #F2F3F5;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .loader {
      width: 120px;
      height: 4px;
      background: #383A40;
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: #5865F2;
      border-radius: 2px;
      animation: loading 1.2s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
